services:
  db:
    image: mariadb:10.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    volumes:
      - db_data:/var/lib/mysql

  php:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-dev}
    ports:
      - "8000:80"
      - "8443:443"
      - "${GAME_MERCURE_PORT}:${GAME_MERCURE_PORT}"
    volumes:
      - ./api:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - GAME_MERCURE_PORT=${GAME_MERCURE_PORT}
      - MERCURE_CORS_ORIGINS=${MERCURE_CORS_ORIGINS}
      - REDIS_URL=${REDIS_URL}
      - MERCURE_URL=${MERCURE_URL}
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL}
      - MERCURE_PUBLISHER_SECRET=${MERCURE_PUBLISHER_SECRET}
      - MERCURE_SUBSCRIBER_SECRET=${MERCURE_SUBSCRIBER_SECRET}
      - GAME_MERCURE_URL=${GAME_MERCURE_URL}
      - GAME_MERCURE_PUBLIC_URL=${GAME_MERCURE_PUBLIC_URL}
      - GAME_MERCURE_PUBLISHER_SECRET=${GAME_MERCURE_PUBLISHER_SECRET}
      - GAME_MERCURE_SUBSCRIBER_SECRET=${GAME_MERCURE_SUBSCRIBER_SECRET}

  william:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
    environment:
      - APP_ENV=worker
      - REDIS_URL=${REDIS_URL}
      - GAME_MERCURE_URL=${GAME_MERCURE_URL}
      - GAME_MERCURE_PUBLIC_URL=${GAME_MERCURE_PUBLIC_URL}
    command: php bin/console app:start:william

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-dev}
    ports:
      - "3000:5173"
    depends_on:
      - php
    volumes:
      - ./front:/app
    environment:
      VITE_API_URL: ${API_URL}
      VITE_MERCURE_URL: ${MERCURE_PUBLIC_URL}

  redis:
    image: redis:alpine

volumes:
  db_data:
  caddy_data:
  caddy_config:
